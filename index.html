<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
overflow:hidden;

background-color:#FFF8FB;

/* GANTI DENGAN GAMBAR PATTERN KAMU */
background-image:url("https://images.unsplash.com/photo-1503796964332-e25e282e390f?q=80&w=765&auto=format&fit=crop");

background-repeat:repeat;
background: size 30px;

animation:fadeBody 1.5s ease;
}

.font-script{
font-family:'Great Vibes',cursive;
}

.font-main{
font-family:'Poppins',sans-serif;
}

/* ---------------- CARD ---------------- */

.card{

opacity:0;

transform:
translateY(60px)
scale(.95);

animation:
showCard 1.2s ease forwards,
floating 6s ease-in-out infinite;

animation-delay:
.4s,
2s;

backdrop-filter:blur(18px);

}

@keyframes showCard{

0%{
opacity:0;
transform:translateY(60px) scale(.95);
}

70%{
transform:translateY(-5px) scale(1.01);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
}

}

@keyframes floating{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-6px);
}

}

/* ---------------- TEXT ---------------- */

.title{

opacity:0;

animation:
fadeUp .9s ease forwards;

animation-delay:1.1s;

}

.subtitle{

opacity:0;

animation:
fadeUp .9s ease forwards;

animation-delay:1.5s;

}

.quote{

opacity:0;

animation:
fadeUp .9s ease forwards;

animation-delay:1.9s;

}

/* ---------------- BUTTON ---------------- */

.btn{

opacity:0;

animation:
fadeUp .9s ease forwards;

animation-delay:2.3s;

transition:.35s;

}

.btn button{

transition:.35s;

}

.btn button:hover{

transform:
translateY(-3px);

box-shadow:

0 15px 35px
rgba(236,72,153,.35);

}

/* ---------------- FADE ---------------- */

@keyframes fadeUp{

from{

opacity:0;

transform:
translateY(20px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

@keyframes fadeBody{

from{

opacity:0;

}

to{

opacity:1;

}

}

/* ========================= */
/* LANDING & LETTER */
/* ========================= */

#landing{
    transition: all .6s ease;
}

#landing.hide{
    opacity:0;
    transform:translateY(-20px);
    pointer-events:none;
}

#letter{

    opacity:0;
    visibility:hidden;

    max-height:0;

    overflow:hidden;

    transform:translateY(30px);

    transition:
        opacity .8s ease,
        transform .8s ease,
        max-height .8s ease;

}

#letter.show{

    opacity:1;

    visibility:visible;

    max-height:1200px;

    transform:translateY(0);

}

/* ========================= */
/* CARD */
/* ========================= */

.card{

    transition:
        max-width .8s ease,
        padding .8s ease;

}

/* Saat surat terbuka */

.card.open{

    max-width:850px;

}
</style>

</head>

<body class="min-h-screen flex justify-center items-center px-5">

<div class="card w-full max-w-2xl mx-4 sm:mx-8 bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 md:p-12">

    <!-- ================= LANDING ================= -->
    <div id="landing">

        <h1 class="title font-script text-5xl sm:text-6xl md:text-7xl text-center text-pink-600">
            Happy Birthday
        </h1>

        <h2 class="subtitle font-main text-xl sm:text-2xl md:text-3xl font-semibold text-center mt-2 text-gray-800">
            My Dearest Byy ❤️
        </h2>

        <div class="flex justify-center mt-10">
            <button id="openBtn"
                class="bg-pink-500 hover:bg-pink-600 transition duration-300 text-white px-8 py-3 rounded-full font-main shadow-lg">
                Open My Heart 💌
            </button>
        </div>

    </div>

    <!-- ================= LETTER ================= -->
    <div id="letter" class="pt-6">

        <h2 class="font-script text-center text-pink-600 text-5xl md:text-6xl">
            To My Dearest ❤️
        </h2>

        <p class="font-main text-gray-700 leading-8 mt-8 text-center">

            Dear Byy,

            <br><br>

            selamat ulang tahun sayaang. terimakasih sudah selalu hadir untukku, aku sangat bersyukur kita bersama. dan semoga kita selalu bersama. melewati semua badai kehidupan, melewati semua ombak besar yang datang

            <br><br>

            With all my love,<br>
            — Yours.

        </p>

    </div>

</div>
    <script>

        const card = document.querySelector(".card");
        const landing = document.getElementById("landing");
        const letter = document.getElementById("letter");
        const openBtn = document.getElementById("openBtn");

        openBtn.addEventListener("click", () => {

            // Landing menghilang
            landing.classList.add("hide");

            // Card sedikit melebar
            card.classList.add("open");

            // Setelah animasi selesai
            setTimeout(() => {

                landing.style.display = "none";

                letter.classList.add("show");

            }, 600);

        });

    </script>
</body>
</html>
